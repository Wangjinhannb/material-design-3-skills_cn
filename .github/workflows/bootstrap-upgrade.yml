name: bootstrap-upgrade

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-upgrade.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore generators and upgrade repository
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/gens-* > /tmp/gens.tar.xz.b64
          base64 -d /tmp/gens.tar.xz.b64 > /tmp/gens.tar.xz
          tar -xJf /tmp/gens.tar.xz -C /
          sed -i "s#/mnt/data/material-design-3-cross-platform-zh-cn#${GITHUB_WORKSPACE}#g" /tmp/*.py
          pip install -r requirements-dev.txt
          python /tmp/update_md3_repo.py
          python /tmp/gen_web_catalog.py
          python /tmp/gen_android_catalog.py
          python /tmp/gen_ios_catalog.py
          python /tmp/gen_windows_catalog.py
          python /tmp/gen_gtk_qt_catalog.py
          python /tmp/gen_harmony_catalog.py
          python /tmp/gen_reference_projects.py
          python /tmp/post_patch.py
          python tools/component_generator/generate_component_docs.py
          python tools/support_matrix/generate.py
          ./scripts/check.sh
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add cross-platform reference apps and component catalogs"
          git push
