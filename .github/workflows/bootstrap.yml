name: Bootstrap repository

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore repository
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/repo.tar.xz.b64
          base64 -d /tmp/repo.tar.xz.b64 > /tmp/repo.tar.xz
          tar -xJf /tmp/repo.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: import Chinese Material Design 3 engineering repository"
          git push
