schema_version: 1
status_definitions:
  official-native: 目标框架存在官方 Material 3 实现；仍需确认是否属于 Classic baseline。
  native-mapped: 复用原生控件并通过主题/样式映射到 M3。
  custom-md3: 目标框架不提供完整 M3，需要自定义视觉与交互层。
  partial: 框架有 Material 风格或部分能力，但不能假定完整符合本 baseline。
  experimental: 仓库已有实现或示例，但尚未达到稳定发布标准。
  documented: 仓库已有完整实现策略和映射文档，但当前环境未完成运行时验证。
